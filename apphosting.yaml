# Firebase App Hosting 설정
# 아래 Firebase 웹 설정값(NEXT_PUBLIC_*)은 브라우저에 그대로 노출되는 공개 값이라
# 커밋해도 안전합니다 (Firebase Admin SDK 비밀키와는 다릅니다).
runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBE7u5QLTaiBKARQcDSpozkiGwrXlPpZ5k"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "family-schedule-6cdd8.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "family-schedule-6cdd8"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "family-schedule-6cdd8.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "259550581663"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:259550581663:web:1cc9529d85c122a36ca3aa"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-XDCVLDWS8V"
    availability:
      - BUILD
      - RUNTIME
